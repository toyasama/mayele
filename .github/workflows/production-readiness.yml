name: Verify and release production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mayele-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mayele
          POSTGRES_PASSWORD: mayele
          POSTGRES_DB: mayele_e2e
        options: >-
          --health-cmd "pg_isready -U mayele -d mayele_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://mayele:mayele@127.0.0.1:5432/mayele_e2e
      DIRECT_URL: postgresql://mayele:mayele@127.0.0.1:5432/mayele_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Clean-code scans
        shell: bash
        run: |
          ! grep -RInE '@clerk/react/legacy|legacy-match|responsive-legacy|tempoFallback|Ãƒ|Ã¢â‚¬â„¢|ÃƒÆ’|\?\?tre|\?\?fini' client/src server/src client/e2e
          ! grep -RInE 'console\.log|REST legacy|route REST legacy|routes REST legacy' client/e2e

      - name: Server audit
        working-directory: server
        run: npm audit --audit-level=moderate

      - name: Client audit
        working-directory: client
        run: npm run audit:ci

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Apply test migrations
        working-directory: server
        run: npm run prisma:migrate:deploy

      - name: Server tests
        working-directory: server
        run: npm run test

      - name: Server build
        working-directory: server
        run: npm run build

      - name: Verify production API image
        shell: bash
        run: |
          set -euo pipefail
          image="mayele-api:${GITHUB_SHA}"
          docker build --tag "$image" .

          container_id="$(docker run --detach --network host \
            --env NODE_ENV=test \
            --env PORT=4000 \
            --env DATABASE_URL="$DATABASE_URL" \
            --env DIRECT_URL="$DIRECT_URL" \
            --env E2E_AUTH_BYPASS=true \
            "$image")"
          cleanup() {
            docker logs --tail 100 "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4000/api/ready >/dev/null; then
              echo "Image API operationnelle."
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "Le conteneur API s'est arrete avant de devenir pret." >&2
              exit 1
            fi
            sleep 2
          done

          echo "L'image API n'est pas devenue prete en 60 secondes." >&2
          exit 1

      - name: Client lint
        working-directory: client
        run: npm run lint

      - name: Client tests
        working-directory: client
        run: npm run test

      - name: Client build
        working-directory: client
        env:
          VITE_API_URL: https://api.mayele-learning.com/api
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_build_validation_1234567890
        run: npm run build

  e2e:
    name: E2E multiplayer and solo
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mayele
          POSTGRES_PASSWORD: mayele
          POSTGRES_DB: mayele_e2e
        options: >-
          --health-cmd "pg_isready -U mayele -d mayele_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://mayele:mayele@127.0.0.1:5432/mayele_e2e
      DIRECT_URL: postgresql://mayele:mayele@127.0.0.1:5432/mayele_e2e
      E2E_ANSWER_UI_BUDGET_MS: "50"
      E2E_REALTIME_UI_BUDGET_MS: "175"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Apply E2E migrations
        working-directory: server
        run: npm run prisma:migrate:deploy

      - name: Check E2E domain constraints
        working-directory: server
        run: npm run db:check-domain

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        working-directory: client
        run: npm run test:e2e

      - name: Verify route performance architecture
        working-directory: client
        run: npm run test:performance

      - name: Summarize E2E failures
        if: failure()
        working-directory: client
        shell: bash
        run: |
          {
            echo '## Diagnostics E2E'
            echo
            echo 'Les contextes Playwright ci-dessous sont limites aux huit premiers echecs et aux 160 premieres lignes par echec.'
            echo

            count=0
            while IFS= read -r -d '' context; do
              count=$((count + 1))
              if [ "$count" -gt 8 ]; then
                break
              fi

              echo "### ${context}"
              echo '```text'
              sed -n '1,160p' "$context"
              echo '```'
              echo
            done < <(find test-results -type f -name error-context.md -print0 2>/dev/null | sort -z)

            if [ "$count" -eq 0 ]; then
              echo 'Aucun fichier error-context.md n a ete genere. Consulter l artefact e2e-diagnostics pour les traces Playwright.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          path: |
            client/test-results
            client/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  responsive-e2e:
    name: Responsive and Safari E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mayele
          POSTGRES_PASSWORD: mayele
          POSTGRES_DB: mayele_e2e
        options: >-
          --health-cmd "pg_isready -U mayele -d mayele_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://mayele:mayele@127.0.0.1:5432/mayele_e2e
      DIRECT_URL: postgresql://mayele:mayele@127.0.0.1:5432/mayele_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Apply E2E migrations
        working-directory: server
        run: npm run prisma:migrate:deploy

      - name: Install Playwright Chromium and WebKit
        working-directory: client
        run: npx playwright install --with-deps chromium webkit

      - name: Run responsive E2E smoke
        working-directory: client
        run: npm run test:responsive

      - name: Run complete responsive and Safari validation
        working-directory: client
        run: npm run test:visual-v5

      - name: Summarize responsive E2E failures
        if: failure()
        working-directory: client
        shell: bash
        run: |
          {
            echo '## Diagnostics responsive E2E'
            echo
            echo 'Les contextes Playwright ci-dessous sont limites aux huit premiers echecs et aux 160 premieres lignes par echec.'
            echo

            count=0
            while IFS= read -r -d '' context; do
              count=$((count + 1))
              if [ "$count" -gt 8 ]; then
                break
              fi

              echo "### ${context}"
              echo '```text'
              sed -n '1,160p' "$context"
              echo '```'
              echo
            done < <(find test-results -type f -name error-context.md -print0 2>/dev/null | sort -z)

            if [ "$count" -eq 0 ]; then
              echo 'Aucun fichier error-context.md n a ete genere. Consulter l artefact responsive-diagnostics pour les traces Playwright.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload responsive diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: responsive-diagnostics-${{ github.run_attempt }}
          path: |
            client/test-results
            client/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: Deploy production
    needs: [quality, e2e, responsive-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://mayele-learning.com
    env:
      PRODUCTION_APP_URL: https://mayele-learning.com
      PRODUCTION_API_URL: https://api.mayele-learning.com
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Validate release secrets
        shell: bash
        run: |
          required=(RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT RAILWAY_SERVICE VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Secret de production manquant: ${name}" >&2
              exit 1
            fi
          done

      - name: Install server release tools
        working-directory: server
        run: |
          npm ci
          npm run prisma:generate

      - name: Validate Railway production environment
        working-directory: server
        shell: bash
        run: |
          npx --yes @railway/cli@5.26.1 run --no-local \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE" \
            -- npm run check:production-env

      - name: Install client release tools
        working-directory: client
        run: npm ci

      - name: Validate Vercel production environment
        working-directory: client
        shell: bash
        run: |
          npx --yes vercel@56.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@56.2.0 env pull .env.production.local --yes --environment=production --token="$VERCEL_TOKEN"
          npm run check:release-config

      - name: Deploy API to Railway
        shell: bash
        run: |
          set -euo pipefail

          railway=(npx --yes @railway/cli@5.26.1)
          railway_context=(--project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE")

          deploy_json="$("${railway[@]}" up --detach --json --yes --message "GitHub ${GITHUB_SHA}" "${railway_context[@]}")"
          echo "$deploy_json"

          if ! deployment_id="$({
            printf '%s' "$deploy_json" | node -e '
              const fs = require("node:fs")
              const result = JSON.parse(fs.readFileSync(0, "utf8"))
              if (typeof result.deploymentId !== "string" || result.deploymentId.length === 0) process.exit(1)
              process.stdout.write(result.deploymentId)
            '
          })"; then
            echo "Railway n'a pas retourné d'identifiant de déploiement exploitable." >&2
            exit 1
          fi

          echo "RAILWAY_DEPLOYMENT_ID=${deployment_id}" >> "$GITHUB_ENV"
          echo "### Railway deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- ID: \`${deployment_id}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

          print_railway_logs() {
            echo "Logs Railway pour le déploiement ${deployment_id} :"
            "${railway[@]}" logs "$deployment_id" --deployment --lines 200 "${railway_context[@]}" || true
            "${railway[@]}" logs "$deployment_id" --build --lines 200 "${railway_context[@]}" || true
          }

          for attempt in {1..60}; do
            if deployments_json="$("${railway[@]}" deployment list --limit 100 --json "${railway_context[@]}")"; then
              status="$({
                printf '%s' "$deployments_json" | DEPLOYMENT_ID="$deployment_id" node -e '
                  const fs = require("node:fs")
                  const deployments = JSON.parse(fs.readFileSync(0, "utf8"))
                  const deployment = deployments.find((item) => item.id === process.env.DEPLOYMENT_ID)
                  if (typeof deployment?.status === "string") process.stdout.write(deployment.status)
                '
              })"

              case "$status" in
                SUCCESS)
                  echo "Déploiement Railway ${deployment_id} réussi."
                  exit 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  echo "Déploiement Railway ${deployment_id} terminé avec l’état ${status}." >&2
                  print_railway_logs
                  exit 1
                  ;;
                "")
                  echo "Déploiement Railway ${deployment_id} pas encore visible (${attempt}/60)."
                  ;;
                *)
                  echo "Déploiement Railway ${deployment_id} en cours : ${status} (${attempt}/60)."
                  ;;
              esac
            else
              echo "Statut Railway temporairement indisponible (${attempt}/60)."
            fi

            sleep 10
          done

          echo "Le déploiement Railway ${deployment_id} n’a pas atteint un état final à temps." >&2
          print_railway_logs
          exit 1

      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 10 "$PRODUCTION_API_URL/api/ready"; then
              exit 0
            fi
            echo "API indisponible, nouvelle tentative dans 5 secondes (${attempt}/60)."
            sleep 5
          done
          echo "L'API Railway n'est pas devenue prete a temps." >&2
          exit 1

      - name: Verify production database after migration
        working-directory: server
        shell: bash
        run: |
          npx --yes @railway/cli@5.26.1 run --no-local --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE" -- npx prisma migrate status
          npx --yes @railway/cli@5.26.1 run --no-local --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE" -- npm run db:check-domain
          npx --yes @railway/cli@5.26.1 run --no-local --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE" -- npm run db:verify-ledger

      - name: Deploy client to Vercel
        working-directory: client
        shell: bash
        run: |
          npx --yes vercel@56.2.0 deploy --yes --force --prod --token="$VERCEL_TOKEN"

      - name: Install production smoke browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Production smoke
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_API_URL/api/health"
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_API_URL/api/ready"
          cd client
          npm run test:production-smoke

      - name: Upload production smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-smoke-diagnostics-${{ github.run_attempt }}
          path: client/test-results/production-smoke
          if-no-files-found: ignore
          retention-days: 7
